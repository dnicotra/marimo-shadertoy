name: Build and deploy to GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The WASM export embeds this marimo version, so keep it pinned to a tested one.
      - name: Install dependencies
        run: pip install "marimo==0.25.1" anywidget numpy pytest

      - name: Check notebook
        run: marimo check shadertoy.py

      - name: Run tests
        run: python -m pytest -q

      - name: Export WebAssembly app and notebook
        run: |
          marimo export html-wasm shadertoy.py -o site --mode run
          marimo export html-wasm shadertoy.py -o site/notebook --mode edit
          # Exported edit-mode notebooks wait for a manual "run all"; make this one start running on load.
          sed -i 's/"auto_instantiate": false/"auto_instantiate": true/' site/notebook/index.html
          grep -q '"auto_instantiate": true' site/notebook/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only the default branch publishes; other branches and PRs just build.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
