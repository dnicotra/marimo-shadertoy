[project]
name = "marimo-shadertoy"
version = "0.1.0"
description = "ShaderToy-style GLSL rendering in marimo, with NumPy arrays as GPU textures and buffers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.25",
    "anywidget>=0.9",
    "numpy>=1.24",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
